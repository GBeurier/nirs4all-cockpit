# nirs4all-cockpit — locked release inventory.
#
# Conforms to cockpit.model.Targets. One entry per package; each target names an
# EXACT registry name and, where a release workflow exists, its trigger + danger
# class + declared dispatch inputs. The cockpit only reads registries from this
# file; it never reimplements repo logic and never invents names.
#
# danger semantics (what a workflow_dispatch does):
#   safe      = dispatch never publishes
#   publish   = dispatch publishes only with the right input/tag
#   dangerous = dispatch publishes outright (strong confirmation in admin)
#
# state semantics:
#   tracked   = expected to be published; reconciled normally
#   excluded  = intentionally not on this registry (reason mandatory)
#   planned   = no release workflow yet (reconciles as missing, flagged, no admin button)
#   manual    = human-only registry action; still probed/displayed, but actionability
#               lives in ops/manual-actions.yaml and does not degrade package rollup

schema_version: 1
owner: GBeurier

packages:
  # ------------------------------------------------------------------------- #
  - id: nirs4all
    repo: nirs4all
    issues_repo: nirs4all
    tag_prefix: ""        # nirs4all tags are unprefixed (e.g. 0.10.1), not v-prefixed
    source_of_truth:
      strategy: python_attr
      path: nirs4all/__init__.py
      attr: __version__
    targets:
      - registry: pages
        name: nirs4all
        state: tracked
        reason: "Canonical common package guide and Legacy Python documentation at https://gbeurier.github.io/nirs4all/; current SDK 1.4.7 documentation is published from source 1aa5f7ed03fd2775284f822d7158450fcc8bd76c"
      - registry: readthedocs
        name: nirs4all
        state: tracked
        reason: "The five existing Read the Docs routes redirect with HTTP 302 to the published SDK 1.4.7 common/Legacy guide from source 1aa5f7ed03fd2775284f822d7158450fcc8bd76c. These redirects are verified; no new native Read the Docs build succeeded, and HTTP availability does not establish one. The last build reported an administrative skip block, distinct from automatic disabling after 25 failures; RTD must confirm/clear both for project 1171458"
      - registry: pypi
        name: nirs4all
        state: tracked
        reason: "Python SDK 1.4.7 is published on PyPI from release source 1a828c3cad6b6571cbe14b9bd7da2f9f1db767cc; the SDK and reference oracle remain separate from the portable Core aggregate"
        workflow:
          file: publish.yml
          trigger: release_published
          danger: dangerous
          publishes_on_dispatch: true
          inputs: []
      - registry: github-release
        name: nirs4all
        state: tracked
        reason: "Python SDK release 1.4.7 is published; current main 1aa5f7ed03fd2775284f822d7158450fcc8bd76c includes the subsequent common/Legacy documentation publication"
    version_aliases: {}

  # ------------------------------------------------------------------------- #
  - id: nirs4all-studio
    repo: nirs4all-studio
    issues_repo: nirs4all-studio
    source_of_truth:
      strategy: npm_package_json
      path: package.json
    tag_prefix: ""
    targets:
      - registry: readthedocs
        name: nirs4all-studio
        state: tracked
        reason: "existing Studio production documentation remains tracked on the current production line"
      - registry: github-release
        name: nirs4all-studio
        state: tracked
        reason: "Studio application release 0.15.2 source/tag 434d8221bc72a3fbb65dcc62b74cfc77e565d34b includes the native SDK 1.4.7 pin correction; Linux, Windows and macOS ARM installers/checksums plus Docker are published, with actual platform UI startup checks. 0.15.1 was never published. Tag pushes and explicit publish_existing_tag retries publish; other dispatches only build/package and smoke the UI"
        workflow:
          file: release-unified.yml
          trigger: workflow_dispatch
          danger: dangerous
          publishes_on_dispatch: true
          inputs:
            - name: tag
              type: string
              required: true
            - name: publish_existing_tag
              type: boolean
              default: false
            - name: skip_docker
              type: boolean
              default: false
            - name: include_macos_x64
              type: boolean
              default: false
    version_aliases: {}

