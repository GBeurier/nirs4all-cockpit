          file: release-r.yml
          trigger: tag
          danger: safe
          publishes_on_dispatch: false
          inputs: []
      - registry: cran
        name: n4m
        state: manual
        reason: "manual web submission; no admin button"
      - registry: cran
        name: pls4all
        state: manual
        reason: "manual web submission; no admin button"
      - registry: github-release
        name: nirs4all-methods
        state: tracked
      - registry: pages
