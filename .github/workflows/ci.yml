name: ci

on:
  push:
    branches: [main, rc/**]
  pull_request:
    branches: [main, rc/**]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install cockpit
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Lint and test
        run: |
          ruff check .
          pytest -q
          mypy --ignore-missing-imports cockpit/release_staging.py cockpit/native_candidate.py scripts/release_staging.py scripts/native_candidate_staging.py
          n4a-cockpit validate-targets ops/targets.yaml
          python scripts/native_candidate_staging.py validate \
            --projection data/native-candidate-staging.json

      - name: Deterministic public R2 staging projection smoke
        run: |
          python scripts/release_staging.py build \
            --manifest ops/release-staging/public-manifest.json \
            --lock ops/release-staging/public-lock.json \
            --out "${RUNNER_TEMP}/release-staging.json"
          cmp "${RUNNER_TEMP}/release-staging.json" data/release-staging.json
          python scripts/release_staging.py validate \
            --manifest ops/release-staging/public-manifest.json \
            --lock ops/release-staging/public-lock.json \
            --projection data/release-staging.json

      - name: Set up Chrome
        uses: browser-actions/setup-chrome@v2

      - uses: actions/setup-node@v6
        with:
          node-version: "24"

      - name: Dashboard smoke
        run: |
          node --check web/app.js
          python scripts/smoke_dashboard_dom.py
